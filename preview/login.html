<!DOCTYPE html>
<html lang="zh-CN" data-mint-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · CloudRail BBS 主题预览</title>
<link rel="stylesheet" href="assets/shell.css">
<style>
body{background:var(--bg)}
/* 顶栏（极简版） */
.auth-top{display:flex;align-items:center;gap:10px;padding:20px 28px}
.auth-brand{display:flex;align-items:center;gap:10px}
.auth-brand .brand-mark{width:32px;height:32px;flex:0 0 32px;border-radius:9px}
.auth-brand .brand-mark svg{width:19px;height:19px}
.auth-brand span{font-size:15px;font-weight:650;letter-spacing:-.01em}
.auth-top .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r-md);border:0;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.icon-act:hover{background:var(--hover);color:var(--text)}
.icon-act svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 主体 */
.auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 24px 40px;min-height:calc(100vh - 76px)}

.card{width:100%;max-width:812px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 1px 2px rgba(17,20,19,.04),0 24px 60px -32px rgba(17,20,19,.16);padding:28px 32px 32px;box-sizing:border-box}

/* 顶部提示 */
.notice{display:flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--text-2);margin-bottom:26px}
.notice svg{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}

/* 两栏 */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:36px}

.title{margin:0 0 6px;font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.25}
.subtitle{font-size:13px;color:var(--text-3);margin:0 0 26px}
.subtitle a{color:var(--brand-ink);font-weight:600}
.subtitle a:hover{text-decoration:underline}

.field{margin-bottom:16px}
.label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:7px}
.label a{font-size:12px;color:var(--text-3)}
.label a:hover{color:var(--brand-ink)}
.input{width:100%;height:46px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;box-sizing:border-box;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:46px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text-3);cursor:pointer}
.pw-eye:hover{background:var(--hover);color:var(--text)}
.pw-eye svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin:0 0 20px;cursor:pointer;user-select:none}
.sq-link{display:inline-block;font-size:12.5px;color:var(--text-3);margin:0 0 16px}
.sq-link:hover{color:var(--brand-ink)}
.check input{appearance:none;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;position:relative;flex:0 0 17px;margin:0;transition:background .15s var(--ease),border-color .15s var(--ease)}
.check input:checked{background:var(--brand);border-color:var(--brand)}
.check input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:5px;height:9px;border:2px solid #FFFFFF;border-top:0;border-left:0;transform:rotate(42deg)}
.check a{color:var(--text-3);font-size:12px}

.submit{width:100%;height:48px;border-radius:var(--r-md);border:1px solid var(--text);background:var(--text);color:var(--bg);font-size:14.5px;font-weight:650;cursor:pointer;font-family:inherit;transition:opacity .15s var(--ease),transform .15s var(--ease)}
.submit:hover{opacity:.92}
.submit:active{transform:scale(.995)}

.divider{display:flex;align-items:center;gap:12px;margin:22px 0 16px;font-size:12px;color:var(--text-3)}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

.oauth{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s var(--ease)}
.oauth:hover{background:var(--hover)}
.oauth svg{width:18px;height:18px;flex:0 0 18px}

/* 扫码栏 */
.scan{border-left:1px solid var(--line);padding-left:36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.scan h3{margin:0 0 16px;font-size:13px;font-weight:600;color:var(--text-2)}
.qr{width:168px;height:168px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;padding:12px;box-sizing:border-box}
.qr svg{width:100%;height:100%;display:block}
.scan p{margin:14px 0 0;font-size:12px;color:var(--text-3);line-height:1.7}
.scan .alt{margin-top:4px;font-size:12px}
.scan .alt a{color:var(--brand-ink);font-weight:600}

/* 页脚 */
.auth-foot{padding:18px 0 28px;text-align:center;font-size:12px;color:var(--text-3)}
.auth-foot .sep{margin:0 8px;color:var(--line-strong)}
.auth-foot a{color:var(--text-3)}
.auth-foot a:hover{color:var(--brand-ink)}

.demo-bar{bottom:20px}
@media (max-width:820px){
  .card{padding:22px 18px 24px;border-radius:18px}
  .cols{grid-template-columns:minmax(0,1fr);gap:0}
  .scan{border-left:0;border-top:1px solid var(--line);padding:24px 0 0;margin-top:24px}
  .title{font-size:21px}
  .auth-top{padding:14px 16px}
}
</style>
</head>
<body>

<header class="auth-top">
  <a class="auth-brand" href="index.html">
    <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="m12 3 7.5 4.5v9L12 21l-7.5-4.5v-9z"/><path d="m12 12 7.5-4.5M12 12v9M12 12 4.5 7.5"/></svg></span>
    <span>薄荷社区</span>
  </a>
  <div class="right">
    <button class="icon-act" id="themeBtn">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
      <span id="themeLbl">深色</span>
    </button>
    <a class="icon-act" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5v10h13v-10"/></svg>
      返回首页
    </a>
  </div>
</header>

<div class="auth-wrap">
  <div class="card">
    <div class="notice">
      <svg viewBox="0 0 24 24"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.2" r=".9" fill="currentColor" stroke="none"/></svg>
      抱歉，您尚未登录，无法进行此操作
    </div>

    <div class="cols">
      <div class="form">
        <h1 class="title">登录薄荷社区</h1>
        <p class="subtitle">还没有账号？<a href="#">立即注册</a></p>

        <div class="field">
          <div class="label"><span>账号</span></div>
          <input class="input" type="text" placeholder="用户名 / UID / 邮箱" autocomplete="username">
        </div>

        <div class="field" style="margin-bottom:12px">
          <div class="label"><span>密码</span><a href="#">找回密码</a></div>
          <div class="pw-wrap">
            <input class="input" type="password" placeholder="输入密码" autocomplete="current-password">
            <button class="pw-eye" type="button" title="显示密码">
              <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
            </button>
          </div>
        </div>

        <a href="#" class="sq-link">设置过安全提问？</a>

        <label class="check">
          <input type="checkbox">
          自动登录
        </label>

        <button class="submit">登录</button>

        <div class="divider">其他方式</div>

        <button class="oauth">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#12B7F5"/><path d="M8.6 10.2c.7-1.9 2-3 3.4-3s2.7 1.1 3.4 3c.2.5.1 1-.2 1.2-.3.2-.7.1-1-.2-.6-.7-1.4-1.1-2.2-1.1s-1.6.4-2.2 1.1c-.3.3-.7.4-1 .2-.3-.2-.4-.7-.2-1.2z" fill="#fff"/></svg>
          QQ 登录
        </button>
      </div>

      <div class="scan">
        <h3>扫码登录</h3>
        <div class="qr">
          <svg viewBox="0 0 120 120" shape-rendering="crispEdges" aria-label="登录二维码">
            <rect width="120" height="120" fill="#fff"/>
            <g fill="var(--text)">
              <!-- 定位角 -->
              <path d="M6 6h30v30H6zM12 12h18v18H12z" fill-rule="evenodd"/>
              <path d="M84 6h30v30H84zM90 12h18v18H90z" fill-rule="evenodd"/>
              <path d="M6 84h30v30H6zM12 90h18v18H12z" fill-rule="evenodd"/>
              <!-- 数据点 -->
              <rect x="46" y="8" width="6" height="6"/><rect x="58" y="8" width="6" height="6"/><rect x="70" y="14" width="6" height="6"/>
              <rect x="46" y="20" width="6" height="6"/><rect x="64" y="20" width="6" height="6"/>
              <rect x="52" y="32" width="6" height="6"/><rect x="70" y="32" width="6" height="6"/>
              <rect x="8" y="46" width="6" height="6"/><rect x="20" y="46" width="6" height="6"/><rect x="32" y="46" width="6" height="6"/>
              <rect x="46" y="46" width="6" height="6"/><rect x="58" y="46" width="6" height="6"/><rect x="70" y="46" width="6" height="6"/><rect x="84" y="46" width="6" height="6"/><rect x="96" y="46" width="6" height="6"/><rect x="108" y="46" width="6" height="6"/>
              <rect x="8" y="58" width="6" height="6"/><rect x="26" y="58" width="6" height="6"/><rect x="46" y="58" width="6" height="6"/><rect x="64" y="58" width="6" height="6"/><rect x="84" y="58" width="6" height="6"/><rect x="102" y="58" width="6" height="6"/>
              <rect x="14" y="70" width="6" height="6"/><rect x="32" y="70" width="6" height="6"/><rect x="52" y="70" width="6" height="6"/><rect x="70" y="70" width="6" height="6"/><rect x="90" y="70" width="6" height="6"/><rect x="108" y="70" width="6" height="6"/>
              <rect x="46" y="84" width="6" height="6"/><rect x="58" y="84" width="6" height="6"/><rect x="76" y="84" width="6" height="6"/><rect x="96" y="84" width="6" height="6"/>
              <rect x="52" y="96" width="6" height="6"/><rect x="70" y="96" width="6" height="6"/><rect x="88" y="96" width="6" height="6"/><rect x="106" y="96" width="6" height="6"/>
              <rect x="46" y="108" width="6" height="6"/><rect x="64" y="108" width="6" height="6"/><rect x="82" y="108" width="6" height="6"/><rect x="100" y="108" width="6" height="6"/>
            </g>
            <rect x="48" y="48" width="24" height="24" rx="6" fill="var(--brand)"/>
            <path d="m54 60 3 3 6-6" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p>用薄荷社区 App 扫码<br>首页右上角「扫一扫」</p>
        <div class="alt"><a href="#">改用手机号验证码登录</a></div>
      </div>
    </div>
  </div>

  <div class="auth-foot">
    <a href="index.html">薄荷社区 · CloudRail BBS Theme</a>
    <span class="sep">·</span>
    <a href="#">切换到旧版登录</a>
  </div>
</div>

<div class="demo-bar">
  <a href="index.html">首页</a>
  <a href="forum.html">版块</a>
  <a href="thread.html">帖子</a>
  <a href="login.html" class="on">登录</a>
</div>

<script>
(function(){
  var root=document.documentElement, lbl=document.getElementById('themeLbl');
  function isDark(){return root.getAttribute('data-mint-theme')==='dark'}
  function set(m){root.setAttribute('data-mint-theme',m);lbl.textContent=m==='dark'?'浅色':'深色';}
  document.getElementById('themeBtn').onclick=function(){set(isDark()?'light':'dark')};
})();
</script>
</body>
</html>
